<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css?family=Lato:400,900&display=swap');
    </style>
    <link rel="stylesheet" href="css/style.css">
    <title>OSF Academy</title>
</head>

<body>
    <header>
        <div class="wrapper">
            <div class="logo">
                <a href="#">
                    <img src="img/logo_icon.png" alt="OSF logo">
                    <div class="logo-text">
                        <span class="logo-osf">OSF</span>
                        <span class="logo-academy">Academy</span>
                    </div>
                </a>
            </div>
            <nav>
                <ul>
                    <li class="arrow">Services</li>
                    <li>Company</li>
                    <li>Library</li>
                    <li>Contact us</li>
                    <li class="lang arrow">EN</li>
                    <li class="lang arrow">$ US</li>
                </ul>
            </nav>
            <div class="icons-menu">
                <span class="fas fa-search"></span>
                <span class="far fa-user"></span>
                <span class="far fa-heart"></span>
                <span class="fas fa-shopping-bag"></span>
                <span class="count wishlist">0</span>
                <span class="count products">0</span>
            </div>
        </div>
    </header>
</body>

</html>
